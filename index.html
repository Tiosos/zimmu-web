<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zimmu — v0.1</title>
    <script>
      // Apply the saved theme before React mounts so a light-theme user never sees a dark flash.
      try {
        if (localStorage.getItem('zimmu:theme:v1') === 'light')
          document.documentElement.dataset.theme = 'light'
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
